# Low-power idle sleep. NOTE: ZMK's CONFIG_ZMK_SLEEP routes through Zephyr's
# poweroff subsystem (sys_poweroff -> EM4), which the EFR32MG24 SoC port does
# not implement (no z_sys_poweroff, never selects HAS_POWEROFF), so it silently
# downgrades to n with a Kconfig warning. Use Zephyr's PM residency subsystem
# instead: on idle the CPU drops to EM2 (deep sleep) via the Gecko
# sl_power_manager backend (auto-selected on S2 when PM=y) while BLE stays
# connected. PM_DEVICE lets drivers suspend around sleep.
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Required for Alps EC11: default EC11_TRIGGER_NONE leaves no IRQ path; ZMK
# sensors never receive DATA_READY callbacks.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Matrix settle (k_busy_wait µs; label in Kconfig says "ticks"). Tune down if
# scanning feels sluggish.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=5
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=5
