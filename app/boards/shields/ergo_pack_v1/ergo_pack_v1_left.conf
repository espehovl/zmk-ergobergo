# SPDX-License-Identifier: MIT
CONFIG_ZMK_SLEEP=y

# Matches right half shared EC11 firmware path (harmless here; left encoder DTS disabled).
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Matrix settle (k_busy_wait µs; label in Kconfig says "ticks"). Tune down if
# scanning feels sluggish.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=5
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=5

# ZMK Studio: realtime keymap editing from https://zmk.studio (Chrome/Edge over
# Web Bluetooth, or USB). Central-only — peripheral half is unaffected.
# BLE transport is auto-enabled via ZMK_STUDIO_TRANSPORT_BLE (default y when ZMK_BLE=y).
CONFIG_ZMK_STUDIO=y
# Locking off while iterating; flip to y (and bind &studio_unlock somewhere) to
# require an explicit unlock keypress before Studio can write.
CONFIG_ZMK_STUDIO_LOCKING=n
